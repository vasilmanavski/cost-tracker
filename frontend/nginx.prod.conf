# ══════════════════════════════════════════════════════════════
# Production nginx config — HTTPS with Let's Encrypt
# Mounted into the frontend container via docker-compose.prod.yml
# ══════════════════════════════════════════════════════════════

# HTTP: redirect to HTTPS + serve ACME challenges
server {
    listen 80;
    server_name moneytrail.online www.moneytrail.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://moneytrail.online$request_uri;
    }
}

# www HTTPS: redirect to apex
server {
    listen 443 ssl;
    server_name www.moneytrail.online;

    ssl_certificate /etc/letsencrypt/live/moneytrail.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moneytrail.online/privkey.pem;

    return 301 https://moneytrail.online$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl;
    server_name moneytrail.online;

    ssl_certificate /etc/letsencrypt/live/moneytrail.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moneytrail.online/privkey.pem;

    # TLS hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Cache static assets (Vite hashes filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # Proxy uploaded files
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
