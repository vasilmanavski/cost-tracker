# ══════════════════════════════════════════════════════════════
# Development — docker compose up
# ══════════════════════════════════════════════════════════════
# Runs PostgreSQL in a container. Backend and frontend run on
# the host for hot reload. Use `make dev` or run manually.
# ══════════════════════════════════════════════════════════════

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cost_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-costtracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-costtracker}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata_dev:
