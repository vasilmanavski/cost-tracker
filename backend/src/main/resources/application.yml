spring:
  application:
    name: cost-tracker

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public

  # File uploads
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Mail (SMTP)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

# Server
server:
  port: 8080

# App
app:
  upload-dir: ./uploads/receipts
  url: ${APP_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:noreply@costtracker.com}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000  # 24 hours
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
