spring:
  application:
    name: cost-tracker

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public

  # File uploads
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Server
server:
  port: 8080

# App
app:
  upload-dir: ./uploads/receipts
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000  # 24 hours
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
