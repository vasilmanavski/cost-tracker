# Dev profile — used inside Docker Compose (backend talks to postgres container)
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/cost_tracker}
    username: ${DB_USERNAME:costtracker}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true

  flyway:
    baseline-on-migrate: true
